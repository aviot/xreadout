<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Pro Readout</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 12px;
        width: 280px;
      }
      .row {
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
      }
      input[type="range"] {
        width: 100%;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: #111;
        color: #fff;
        padding: 8px 10px;
        cursor: pointer;
      }
      .hint {
        color: #666;
        font-size: 12px;
      }
      .status {
        margin-top: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <label>
        <input id="enabled" type="checkbox" />
        Auto Read（自动朗读）
      </label>
    </div>

    <div class="row">
      <label for="rate">语速（0.5 - 2.0）</label>
      <input id="rate" type="range" min="0.5" max="2" step="0.1" />
      <div class="hint" id="rateValue"></div>
    </div>

    <div class="row">
      <label for="volume">音量（0.0 - 1.0）</label>
      <input id="volume" type="range" min="0" max="1" step="0.1" />
      <div class="hint" id="volumeValue"></div>
    </div>

    <div class="row">
      <button id="readLatest" type="button">朗读最新动态</button>
      <div id="status" class="status hint"></div>
    </div>

    <div class="hint">仅在 pro.x.com 页面生效。</div>

    <script src="popup.js"></script>
  </body>
</html>
