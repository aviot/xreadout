<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Following Readout</title>
    <style>
      body {
        margin: 0;
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f1419;
        color: #e7e9ea;
      }
      .wrap {
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: #8b98a5;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
      }
      input,
      select {
        border: 1px solid #2f3336;
        border-radius: 8px;
        padding: 8px;
        background: #202327;
        color: #e7e9ea;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 9px 10px;
        background: #1d9bf0;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch input {
        width: auto;
      }
      .hint {
        margin-top: 8px;
        font-size: 11px;
        color: #8b98a5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>X Following 自动刷新朗读</h1>

      <div class="row switch">
        <input id="enabled" type="checkbox" />
        <label for="enabled" style="margin: 0; color: #e7e9ea">启用自动刷新+朗读</label>
      </div>

      <div class="row">
        <label for="intervalSec">刷新间隔（秒）</label>
        <input id="intervalSec" type="number" min="15" step="5" />
      </div>

      <div class="row">
        <label for="voiceSelect">语音</label>
        <select id="voiceSelect"></select>
      </div>

      <div class="row">
        <label for="rate">语速（0.5 - 2）</label>
        <input id="rate" type="number" min="0.5" max="2" step="0.1" />
      </div>

      <div class="row">
        <label for="volume">音量（0 - 1）</label>
        <input id="volume" type="number" min="0" max="1" step="0.1" />
      </div>

      <div class="row">
        <button id="readNowBtn">朗读最新内容</button>
      </div>

      <div class="hint">请在 x.com/home 页面使用，并切到 Following 标签。</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
